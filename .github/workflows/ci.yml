name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install -e ".[dev]"
      - name: Build distributions
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/ordersim-smoke
          /tmp/ordersim-smoke/bin/python -m pip install dist/*.whl
          /tmp/ordersim-smoke/bin/python -c "from ordersim import cpp_execution_engine_available; assert cpp_execution_engine_available()"
          /tmp/ordersim-smoke/bin/python examples/canonical.py

  native-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native C++ tests
        run: |
          mkdir -p build/cpp
          c++ -std=c++17 -Wall -Wextra -pedantic -Icpp cpp/tests/matching_engine_core_test.cpp -o build/cpp/matching_engine_core_test
      - name: Run native C++ tests
        run: build/cpp/matching_engine_core_test

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest
