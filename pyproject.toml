[build-system]
requires = ["setuptools>=68", "pybind11>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "ordersim"
version = "0.1.1"
description = "Inspectable execution simulator for order-book replay"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "ordersim contributors" },
]
keywords = [
  "algorithmic trading",
  "backtesting",
  "execution simulator",
  "limit order book",
  "market microstructure",
  "order book",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
databento = [
  "databento",
]
dev = [
  "build>=1.2",
  "pyarrow>=23",
  "pybind11>=3",
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.8",
  "setuptools>=68",
  "twine>=6",
]
parquet = [
  "pyarrow>=23",
]

[project.urls]
Repository = "https://github.com/tradingexpert/ordersim"
Issues = "https://github.com/tradingexpert/ordersim/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ordersim = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = [
  "--cov=ordersim",
  "--cov-report=term-missing",
  "--cov-fail-under=95",
]

[tool.coverage.run]
branch = true
source = ["ordersim"]

[tool.coverage.report]
show_missing = true
skip_covered = false
