[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ordersim"
version = "0.0.0"
description = "Inspectable Python execution simulator for order-book replay"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "ordersim contributors" },
]
keywords = [
  "algorithmic trading",
  "backtesting",
  "execution simulator",
  "limit order book",
  "market microstructure",
  "order book",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/tradingexpert/ordersim"
Issues = "https://github.com/tradingexpert/ordersim/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ordersim"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = [
  "--cov=ordersim",
  "--cov-report=term-missing",
  "--cov-fail-under=95",
]

[tool.coverage.run]
branch = true
source = ["ordersim"]

[tool.coverage.report]
show_missing = true
skip_covered = false
