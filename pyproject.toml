[build-system]
requires = ["setuptools>=68", "pybind11>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "ordersim"
version = "0.1.3"
description = "Inspectable execution simulator for order-book replay and latency-aware fill simulation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "ordersim contributors" },
]
keywords = [
  "algorithmic trading",
  "backtesting",
  "execution modeling",
  "execution simulator",
  "fill simulation",
  "latency modeling",
  "latency simulation",
  "limit order book",
  "market microstructure",
  "market replay",
  "market simulator",
  "market structure",
  "order book",
  "order book replay",
  "order simulator",
  "quantitative finance",
  "trading systems",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
binance = [
  "websockets>=14",
]
databento = [
  "databento",
]
dev = [
  "build>=1.2",
  "pyarrow>=23",
  "pybind11>=3",
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.8",
  "setuptools>=68",
  "twine>=6",
]
parquet = [
  "pyarrow>=23",
]

[project.scripts]
ordersim-binance-capture = "ordersim.connectors.binance.capture:main"

[project.urls]
Repository = "https://github.com/tradingexpert/ordersim"
Issues = "https://github.com/tradingexpert/ordersim/issues"
Documentation = "https://github.com/tradingexpert/ordersim/tree/main/docs"
Changelog = "https://github.com/tradingexpert/ordersim/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ordersim = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = [
  "--cov=ordersim",
  "--cov-report=term-missing",
  "--cov-fail-under=95",
]

[tool.coverage.run]
branch = true
source = ["ordersim"]

[tool.coverage.report]
show_missing = true
skip_covered = false
